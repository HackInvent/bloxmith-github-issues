<div data-properties-surface="modal" class="modal-panel cw-github-issues-modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}BlockModalTitle" data-generic-block-modal-root data-github-issues-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="{{ node_kind }}">
  <div class="modal-header">
    <div>
      <span class="panel-kicker">{{ node_kind_title }} block</span>
      <h2 id="{{ node_id }}BlockModalTitle">{{ node_title }}</h2>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Close</button>
    </div>
  </div>

  {{ modal_body_html }}

  <div class="github-issues-modal-footer">
    <span class="field-hint">The token stays masked. Write actions stay in dry-run while the option is checked.</span>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Cancel</button>
      <button class="solid-btn" data-block-apply type="button" disabled>Apply</button>
    </div>
  </div>
</div>
